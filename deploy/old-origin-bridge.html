<!doctype html>
<!--
  Old-origin bridge (#887, #888). This is what deming.leedurbin.co.nz serves
  in place of the site during #888's Stage 1. It reads the
  reader's saved data, which only a first-party page on the old origin can
  see, and carries it to the same path on learndeming.org in a URL fragment.
  The logic lives in assets/scripts/origin-handoff.js on the new origin, so
  the sending and receiving halves can't drift apart; see its header.

  It's a template. scripts/build-old-origin-bridge.R writes one copy per
  page of the site, with the placeholder token replaced by that page's URL on the new
  origin, so each copy has its own canonical link and a <noscript> redirect
  to the same page. See R/functions/old-origin-bridge.R.

  Same bytes for every client, so it doesn't break AGENTS.md's rule that
  anonymous and crawler views are identical.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!--
  The importer accepts the fragment only when the referrer's origin is this
  one. strict-origin-when-cross-origin is the browser default, which sends
  exactly the origin. It's pinned here so a server header can't weaken it.
-->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>12 Days to Deming has moved to learndeming.org</title>
<link rel="canonical" href="__NEW_URL__">
<noscript><meta http-equiv="refresh" content="0; url=__NEW_URL__"></noscript>
<style>
  body { font: 1.0625rem/1.6 system-ui, -apple-system, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: #1f2933; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #e4e7eb; background: #1f2933; } a { color: #7cc4fa; } }
  [hidden] { display: none; }
  button { font: inherit; padding: 0.5rem 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>12 Days to Deming has moved</h1>
  <p id="moving">Taking you to <a id="continue" href="__NEW_URL__">learndeming.org</a>…</p>

  <div id="too-large" hidden>
    <p id="too-large-lead" tabindex="-1">Your saved answers are too large to carry over to the new address automatically. They are still saved in this browser, and nothing has been deleted.</p>
    <p>Download a copy now so you can keep them:</p>
    <p><button type="button" id="download">Download my saved answers</button></p>
    <p>Then <a id="continue-large" href="__NEW_URL__">continue to learndeming.org</a>.</p>
  </div>
</main>

<script src="https://learndeming.org/assets/scripts/origin-handoff.js"></script>
<script>
  (function () {
    var fallback = "https://learndeming.org" + location.pathname + location.search + location.hash;
    document.getElementById("continue").href = fallback;

    // If the script didn't load, don't strand the reader here. Their data
    // stays on this origin, and a later visit tries again.
    if (!window.tdOriginHandoff) {
      location.replace(fallback);
      return;
    }

    var storage = null;
    try { storage = window.localStorage; } catch (e) {}

    window.tdOriginHandoff.send({
      location: location,
      storage: storage || { length: 0 },
      offerDownload: function (continueUrl, json) {
        document.getElementById("moving").hidden = true;
        document.getElementById("too-large").hidden = false;
        document.getElementById("continue-large").href = continueUrl;
        // Move focus to the explanation so a screen reader announces it
        // instead of the "Taking you to…" line it replaced.
        document.getElementById("too-large-lead").focus();
        document.getElementById("download").addEventListener("click", function () {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
          a.download = "12-days-to-deming-saved-answers.json";
          a.click();
          // Revoking in the same tick can cancel the download in Firefox.
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
        });
      },
    });
  })();
</script>
</body>
</html>
