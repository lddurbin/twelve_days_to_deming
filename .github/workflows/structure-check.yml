name: Structure Check

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize]
    # The structure check only validates QMDs against manifests, plus the
    # images they reference and the script/workflow themselves. Narrow the
    # trigger to those paths so unrelated PRs (CSS-only, JS-only, prose
    # outside content/, etc.) don't burn CI minutes on it.
    paths:
      - 'content/**'
      # The book's front matter sits at the repository root, not under
      # content/ — index.qmd and welcome.qmd have had manifests since #802,
      # and without this an edit to either would skip the check that reads it.
      - '*.qmd'
      - 'workflow/validation/**'
      - 'assets/images/**'
      - 'scripts/check-structure.sh'
      - '.github/workflows/structure-check.yml'
  # Merge queue: deliberately no `paths` filter here so the queue gets a
  # status report on the gh-readonly-queue/main/<sha> branch even when a
  # queued PR doesn't itself touch the structure-check input paths. Without
  # this, the queue can stall waiting for a check that the path filter
  # suppressed.
  merge_group:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup Ruby
      uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c  # v1.322.0
      with:
        ruby-version: '3.2'

    - name: Run structure checks
      run: |
        overall_fail=0
        for d in $(seq 1 12); do
          echo "::group::Day $d"
          ./scripts/check-structure.sh "$d" || overall_fail=1
          echo "::endgroup::"
        done

        # Every manifest that is not a day's. Globbed rather than listed so a
        # new one is checked the moment it exists — which is how #802's three
        # new manifests arrived. The glob used to be `appendix-*`, and would
        # have skipped index-manifest.yml and welcome-manifest.yml in silence.
        shopt -s nullglob
        for manifest in workflow/validation/*-manifest.yml; do
          name=$(basename "$manifest" -manifest.yml)
          case "$name" in day-*) continue ;; esac
          echo "::group::Manifest $name"
          ./scripts/check-structure.sh --manifest "$name" || overall_fail=1
          echo "::endgroup::"
        done

        exit "$overall_fail"
