name: Build and Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Opt r-lib/actions into Node 24 ahead of the Sept 2026 Node 20 removal.
# Remove once r-lib publishes a v3 tag that runs on Node 24 natively.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-js:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run JavaScript tests
      run: npm test

  # Build and deploy are separate jobs so the rendered site exists as a named
  # artifact rather than only as a directory inside the job that ships it.
  # That makes "deploy the same verified bytes somewhere else" — a PR preview,
  # a staging site, a different host — a matter of adding a consumer of the
  # artifact rather than rewriting this workflow. See #532.
  build:
    needs: test-js
    runs-on: ubuntu-latest
    # Inherits the workflow-level `contents: read`. Only the deploy job needs
    # write, and only for the deploy tag.
    outputs:
      html_count: ${{ steps.smoke.outputs.html_count }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup R
      id: setup-r
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2
      with:
        r-version: '4.5.1'
        use-public-rspm: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libpng-dev \
          libjpeg-dev \
          libcairo2-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          build-essential \
          gfortran \
          libgmp3-dev \
          libglpk-dev

    - name: Setup Pandoc
      uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2
      with:
        pandoc-version: '3.1.11'

    - name: Cache Quarto installation
      id: cache-quarto
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: /opt/quarto
        key: quarto-1.4.549

    - name: Install Quarto
      if: steps.cache-quarto.outputs.cache-hit != 'true'
      run: |
        curl -LO https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.549/quarto-1.4.549-linux-amd64.deb
        sudo dpkg -i quarto-1.4.549-linux-amd64.deb

    - name: Add Quarto to PATH
      run: echo "/opt/quarto/bin" >> $GITHUB_PATH

    - name: Cache R packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/R/renv
        key: ${{ runner.os }}-r${{ steps.setup-r.outputs.installed-r-version }}-renv-${{ hashFiles('renv.lock') }}
        restore-keys: ${{ runner.os }}-r${{ steps.setup-r.outputs.installed-r-version }}-renv-

    - name: Restore R packages
      shell: Rscript {0}
      run: |
        if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv", version = "1.0.3")
        renv::restore()

    - name: Run R unit tests
      run: Rscript -e 'testthat::test_dir("tests/testthat")'

    - name: Cache Quarto freeze outputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: _freeze
        key: ${{ runner.os }}-freeze-${{ hashFiles('renv.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-freeze-${{ hashFiles('renv.lock') }}-
          ${{ runner.os }}-freeze-

    - name: Build Quarto book (EN)
      run: quarto render

    # FR must render AFTER EN: Quarto cleans its output-dir before each render,
    # and the FR output-dir (_book/fr) is nested inside EN's (_book). Rendering
    # EN second would wipe the FR tree. This produces the merged _book/{,fr/}
    # tree the single rsync below ships.
    #
    # Gated on the DEPLOY_FR repo variable (Settings → Variables), default off.
    # While the French edition is built incrementally on main, this stays off so
    # partial FR never reaches production — every merge re-deploys EN only. Flip
    # DEPLOY_FR to 'true' on launch day to ship the complete FR edition at /fr/;
    # flip back to roll the launch back. No code change needed either way.
    - name: Build Quarto book (FR)
      if: vars.DEPLOY_FR == 'true'
      run: quarto render --profile fr

    # Stays on the build job deliberately: this validates what the build
    # produced, and that reasoning holds for every future consumer of the
    # artifact, not just the rsync below.
    - name: Smoke test build output
      id: smoke
      env:
        DEPLOY_FR: ${{ vars.DEPLOY_FR }}
      run: |
        echo "Checking index.html exists..."
        test -f _book/index.html || { echo "FAIL: _book/index.html missing"; exit 1; }

        HTML_COUNT=$(find _book -name "*.html" | wc -l)
        echo "Found $HTML_COUNT HTML files"
        # Prevents rsync --delete from wiping production on partial builds
        if [ "$HTML_COUNT" -lt 10 ]; then
          echo "FAIL: Build produced fewer than 10 HTML files — aborting deploy"
          exit 1
        fi

        echo "Checking converted days..."
        for day_dir in content/days/day-*/; do
          day=$(basename "$day_dir" | sed 's/day-//')
          ls _book/content/days/day-${day}/*.html > /dev/null 2>&1 || { echo "FAIL: No HTML files for day-${day}"; exit 1; }
          echo "  day-${day}: OK"
        done

        # FR assertions only apply when DEPLOY_FR is on (matching the gated FR
        # render step above). While FR is off, _book/fr is never produced and
        # asserting it would fail the EN-only deploy.
        if [ "$DEPLOY_FR" = "true" ]; then
          echo "Checking FR build output..."
          # FR entry page is a Quarto-generated index.html that redirects to
          # index.fr.html (the first chapter is index.fr.qmd). Asserting
          # index.html both gates the deploy and verifies the redirect shipped.
          test -f _book/fr/index.html || { echo "FAIL: _book/fr/index.html missing"; exit 1; }

          # FR content lives in content-fr/ and renders to _book/fr/content-fr/.
          # FR_CONTENT_GLOBS is the generalization point: today FR has only the
          # stub welcome page, so adding FR day content later is a one-line glob
          # addition (e.g. "content-fr/days/day-*/*.qmd"), not a workflow refactor.
          FR_CONTENT_GLOBS=(
            "content-fr/*.qmd"
          )
          for glob in "${FR_CONTENT_GLOBS[@]}"; do
            for src in $glob; do
              [ -e "$src" ] || continue
              html="_book/fr/${src%.qmd}.html"
              test -f "$html" || { echo "FAIL: missing FR HTML $html (from $src)"; exit 1; }
              echo "  ${src}: OK"
            done
          done
        else
          echo "DEPLOY_FR not 'true' — skipping FR assertions (EN-only deploy)"
        fi

        echo "Smoke test passed"

        # Published as a job output so the deploy job can assert the artifact
        # it downloaded is complete — see "Verify downloaded artifact" below.
        echo "html_count=$HTML_COUNT" >> "$GITHUB_OUTPUT"

    - name: Upload site artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: site
        path: _book
        # The site ships via `rsync --delete`, so anything silently dropped
        # here would be *removed* from production. Hidden files are excluded
        # by default, and _book has none today, but the failure mode is
        # invisible enough to be worth closing outright.
        include-hidden-files: true
        if-no-files-found: error
        # Long enough to pull the exact bytes of a bad deploy for comparison,
        # short enough that a ~37MB artifact per merge doesn't accumulate.
        retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Build runs on whatever ref it was given; shipping is restricted to main.
    # This is what makes `gh workflow run deploy.yml --ref <branch>` a safe way
    # to exercise the build and artifact steps without touching production.
    #
    # The tag clause preserves docs/ROLLBACK.md Option 2, which rolls back by
    # dispatching this workflow against a `deploy-*` tag — a bare main-only
    # check would silently turn that documented procedure into a no-op.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/deploy-')
    permissions:
      contents: write

    steps:
    # Runs every time, but the repo content it provides is used only by the
    # tagging step below. The shipped bytes come from the artifact.
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Deliberately a major ahead of the upload above (which has no v8): v8
    # defaults `digest-mismatch` to `error`, where v7 only warned. The verify
    # step below counts files, so it catches a truncated download but not a
    # corrupted one — garbled bytes inside a file keep the count intact. Since
    # whatever lands here goes straight into `rsync --delete`, having the
    # transport fail closed on a hash mismatch is worth the version skew.
    - name: Download site artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: site
        path: _book

    # Splitting the jobs put an upload/download between the smoke test and the
    # `rsync --delete`, so "the build was complete" no longer implies "these
    # bytes are complete". Comparing against the build's own count catches a
    # truncated transfer, which a fixed threshold would not.
    - name: Verify downloaded artifact
      env:
        EXPECTED_HTML_COUNT: ${{ needs.build.outputs.html_count }}
      run: |
        test -f _book/index.html || { echo "FAIL: _book/index.html missing from artifact"; exit 1; }

        ACTUAL=$(find _book -name "*.html" | wc -l)
        if [ "$ACTUAL" -ne "$EXPECTED_HTML_COUNT" ]; then
          echo "FAIL: artifact has $ACTUAL HTML files, build produced $EXPECTED_HTML_COUNT — aborting deploy"
          exit 1
        fi
        echo "Artifact verified: $ACTUAL HTML files"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p 18765 -H ssh.leedurbin.co.nz >> ~/.ssh/known_hosts 2>/dev/null
        if [ ! -s ~/.ssh/known_hosts ]; then
          echo "ERROR: ssh-keyscan failed to retrieve host key"
          exit 1
        fi

    - name: Backup current deployment
      run: |
        DEPLOY_PATH="www/deming.leedurbin.co.nz/public_html"
        BACKUP_DIR="www/deming.leedurbin.co.nz/backups"
        SSH_CMD="ssh -p 18765 u197-gmrgybn3hkn2@ssh.leedurbin.co.nz"

        echo "Creating pre-deploy backup..."
        $SSH_CMD "mkdir -p ${BACKUP_DIR} && \
          if [ -d ${DEPLOY_PATH} ]; then \
            cp -r ${DEPLOY_PATH} ${BACKUP_DIR}/public_html.backup.\$(date +%Y%m%d%H%M%S) && \
            cd ${BACKUP_DIR} && ls -1d public_html.backup.* 2>/dev/null | sort | head -n -5 | xargs -r rm -rf; \
          else \
            echo 'No existing deployment found, skipping backup'; \
          fi"
        echo "Backup complete"

    - name: Deploy to server
      run: |
        rsync -avz --delete -e "ssh -p 18765" _book/ u197-gmrgybn3hkn2@ssh.leedurbin.co.nz:www/deming.leedurbin.co.nz/public_html/

    # Everything before this point validates bytes the runner can see. This is
    # the first check that asks the live site what it is actually serving, so
    # it is the only one that can catch a partial rsync, a permissions problem,
    # or a server-side failure. See #533.
    #
    # Placed before the tagging step on purpose: docs/ROLLBACK.md treats
    # `deploy-*` tags as known-good rebuild points, so a deploy that failed
    # verification must not mint one — otherwise a later rollback could target
    # the very release that broke.
    #
    # Detection only. Rollback stays manual (ROLLBACK.md Option 1); for a
    # static site the worst case is a few minutes of bad HTML, which does not
    # justify automating a destructive action.
    - name: Verify production
      env:
        CACHE_BUST: ${{ github.run_id }}-${{ github.run_attempt }}
      run: ./scripts/verify-deployment.sh https://deming.leedurbin.co.nz _book

    - name: Tag deployment
      run: |
        git tag "deploy-$(date +%Y%m%d%H%M%S)"
        git push --tags

    - name: Cleanup SSH
      if: always()
      run: rm -f ~/.ssh/id_rsa
