name: Validation Staleness

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize]
    # Only the comparison pipeline and the recorded results can make a result
    # stale (see scripts/check-validation-staleness.sh and #720) — narrow the
    # trigger so unrelated PRs don't burn CI minutes on it.
    #
    # Every entry in SCORER_VERSION_FILES (scripts/lib/scorer-version.sh) must
    # appear below, or an edit to one of those files won't trigger the check
    # that exists to catch it. tests/test_scorer_version.py enforces that, for
    # both trigger blocks — a path filter is not a place to notice drift late.
    paths:
      - 'scripts/lib/paragraph_similarity.py'
      - 'scripts/lib/paragraphs.py'
      - 'scripts/lib/pdf_callouts.py'
      - 'scripts/lib/qmd_strip.py'
      - 'scripts/lib/short_content.py'
      - 'scripts/validate-transcription.sh'
      - 'scripts/lib/scorer-version.sh'
      - 'workflow/validation/results/**'
      - 'scripts/check-validation-staleness.sh'
      - '.github/workflows/validation-staleness.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/lib/paragraph_similarity.py'
      - 'scripts/lib/paragraphs.py'
      - 'scripts/lib/pdf_callouts.py'
      - 'scripts/lib/qmd_strip.py'
      - 'scripts/lib/short_content.py'
      - 'scripts/validate-transcription.sh'
      - 'scripts/lib/scorer-version.sh'
      - 'workflow/validation/results/**'
      - 'scripts/check-validation-staleness.sh'
      - '.github/workflows/validation-staleness.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # No PDFs needed or used — this only compares each recorded result's
    # scorer_version against a hash recomputed from the comparison pipeline as
    # it exists right now. See workflow/validation/results/README.md.
    - name: Check recorded results against current pipeline
      run: ./scripts/check-validation-staleness.sh
