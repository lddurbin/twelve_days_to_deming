project:
  type: book
  resources:
    - "assets/fonts/**"
    # Quarto only copies a script into _book if it sees it in a <script src>
    # tag; a module reached solely through an ES `import` from another module
    # is invisible to that scan and silently 404s in production (#494 —
    # feedback-prompt.js and feedback-transport.js both went missing this
    # way, and the deploy is an rsync --delete of _book, so nothing on the
    # server would have covered for it). Declaring the directory makes the
    # copy independent of how any given module happens to be referenced.
    - "assets/scripts/**"
    # Generated by scripts/generate-llms-txt.R below, before this list is
    # resolved — see #511. Not declaring it here means it silently doesn't
    # ship to _book/ (and deploy.yml's rsync --delete never notices), the
    # exact failure mode already documented above for assets/scripts/**.
    - "llms.txt"
  pre-render:
    # Regenerates llms.txt (https://llmstxt.org) from _quarto-en.yml's
    # chapter list and each chapter's own `pagetitle`/`description` front
    # matter, so the resources: entry above has something current to copy.
    # See #511 and R/functions/llms-txt.R for the generation logic.
    - Rscript scripts/generate-llms-txt.R
  post-render:
    # Fixes og:description/twitter:description falling back to the
    # book-level description on every page, regardless of the page's own
    # `description:` — a Quarto bug specific to boolean `open-graph`/
    # `twitter-card` config on book projects. See #521 and
    # R/functions/og-description-fix.R for the root cause.
    - Rscript scripts/fix-og-description.R
    # Fixes the `headers` attribute gt (pinned 1.3.0) emits in the wrong
    # token order on the red-beads results tables on Day 2's "Your Turn"
    # page — a gt HTML-emission bug with no table-option workaround. See
    # #586 and R/functions/redbeads-headers-fix.R for the root cause.
    - Rscript scripts/fix-redbeads-headers.R

profile:
  default: en

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

book:
  title: "12 Days to Deming"
  subtitle: "An active-learning course"
  author: "Henry R. Neave"
  site-url: https://deming.leedurbin.co.nz
  description: >
    The complete text of Dr Henry R. Neave's 12 Days to Deming — a free,
    interactive active-learning course on W. Edwards Deming's management
    philosophy, published online with the author's permission.
  favicon: assets/images/favicon.png
  image: assets/images/og-card.png
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/lddurbin/twelve_days_to_deming
  reader-mode: true
  sidebar:
    collapse-level: 1
  page-footer:
    left: |
      Course content © Dr Henry R. Neave. Reproduced with permission (May 2026).
    right: |
      Web edition by [Lee Durbin](https://leedurbin.co.nz) <span aria-hidden="true">·</span> [Privacy](/privacy.html)

filters:
  - filters/reading-time.lua

format:
  html:
    title-prefix: ""
    # Quarto 1.10.18 defaults to MathJax 4, whose CHTML renderer emits a
    # deprecated `align` attribute on the <mjx-itable> it generates for
    # tagged/numbered equations (see content/appendix/optional-extras/
    # 06-part-f-technical.qmd) — a pa11y failure not present under
    # MathJax 3. Pinned to the exact v3 URL production already serves
    # (#514) rather than accepting new a11y regressions as a side effect
    # of an unrelated CI toolchain bump.
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js
    theme:
      light: [cosmo, assets/styles/disable-google-fonts.scss]
      dark: [darkly, assets/styles/disable-google-fonts.scss]
    css: assets/styles/main.css
    header-includes: |
      <!--
        font-src includes cdn.jsdelivr.net because MathJax's CHTML renderer
        loads its own web font (mathjax-newcm-font) from there — the same
        host script-src/connect-src already trust for MathJax's JS, but
        trusting a host for scripts says nothing about trusting it for
        fonts under CSP. Without this, every math glyph (letters, digits,
        √, overlines) 404s against the policy and the browser substitutes
        glyphs from whatever font claims those Unicode PUA codepoints
        instead, corrupting every rendered formula site-wide. Confirmed via
        a CSP violation in local testing before this line was added.

        connect-src also includes api.web3forms.com for the chapter-rating
        widget's thumbs-down text box (#494). It is the ONLY host the site
        posts reader-written content to — there is no backend on the origin
        to receive it — and it is deliberately not in script-src: nothing is
        loaded from that host, only sent to it. See privacy.qmd, which
        discloses exactly what travels with it, and feedback-transport.js,
        which is the single place that constructs the request.
      -->
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: https://queue.simpleanalyticscdn.com; connect-src 'self' https://cdn.jsdelivr.net https://queue.simpleanalyticscdn.com https://api.web3forms.com;">
      <!--
        Subresource Integrity (#581): audited every externally-hosted
        script/link the rendered site emits. None currently get `integrity`/
        `crossorigin` attributes — not an oversight, each is excluded for a
        specific, verified reason:

        - MathJax script (jsdelivr, pinned via html-math-method.url above):
          the URL floats on major version `@3` (not an exact release), and
          Quarto 1.10.18's html-math-method schema has no `integrity` field
          — the `<script src>` tag is emitted by pandoc's own math writer,
          outside anything this file configures.
        - The cdnjs.cloudflare.com polyfill.io mirror pandoc's HTML template
          emits alongside MathJax: also floats on `v3`, also outside this
          file's control, and its response varies by request User-Agent —
          not a fixed byte sequence a single hash could ever validate. Moot
          in practice anyway: script-src above doesn't list cdnjs.
          cloudflare.com, so CSP already blocks it from executing.
        - Simple Analytics' latest.js below is deliberately unpinned — that
          IS the point of "latest" — so there is no stable version to hash
          against; pinning it would just mean the script silently stops
          loading the next time Simple Analytics ships an update.
        - api.web3forms.com (connect-src only, see above) is a fetch()
          destination, never a loaded script/link — SRI has nothing to
          attach to there.
        - The one resource that passes SRI's own bar — explicitly pinned,
          confirmed byte-identical across repeat fetches, served
          `Cache-Control: immutable` — is the Observable Plot ESM import in
          content/days/day-03/{11,12,13}*.qmd (`@observablehq/plot@0.6.16`).
          Classic `integrity`/`crossorigin` attributes don't apply to a bare
          `await import(url)`; the only mechanism is the `integrity` key in
          a `<script type="importmap">` (Chrome 127+, Firefox 138+, Safari
          18+, ignored gracefully elsewhere). But rendering a day-03 page
          and inspecting <head> in document order confirms Quarto emits
          `quarto-ojs-runtime.js` as a `<script type="module">` from its own
          htmldependencies mechanism, which lands ahead of anything this
          header-includes block contributes (including per-page
          include-in-header) — an import map inserted this late registers
          after that module's fetch has already started and is silently
          ignored by the browser. Fixing it needs Quarto's own dependency
          ordering bypassed (e.g. a post-render HTML rewrite relocating the
          tag), which is real engineering, not a one-line config change —
          tracked separately as #597 rather than folded into #581.
      -->
      <!--
        iOS Safari/WebKit (all iOS browsers, including Firefox, since Apple
        requires WebKit there) auto-detects number-like text and turns it
        into a tappable tel: link unless a page opts out. Several chapters'
        Technical Aids sections contain bare numeric sequences (e.g. Day 3
        Chapter 5's "13 19 18 14 16 12 21 18 17 22") in
        <p class="data-sequence-mono">/<p class="text-center"> markup, which
        iOS was rendering as phone links (#583). No content on this site is
        an intentional tel: link (confirmed by grep), so opting out
        site-wide is safe.
      -->
      <meta name="format-detection" content="telephone=no">
      <!--
        Simple Analytics: cookieless, EU-hosted, honours Do Not Track (DNT)
        by default. data-collect-dnt="false" is written here — rather than
        left to that default — so the privacy stance is auditable in config:
        this site should undercount DNT readers rather than override their
        preference. No <noscript> fallback pixel is added (JS-disabled
        readers are a rounding error here) — but img-src still needs
        queue.simpleanalyticscdn.com regardless, because latest.js sends
        pageviews as an <img> beacon by default, not just fetch(); confirmed
        by a CSP violation in local testing before this line was added.

        Loaded conditionally, keyed on hostname, rather than as a static
        tag: the persistent staging site (#536) must not report pageviews
        under production's Simple Analytics site, and the per-PR previews
        in accessibility.yml (never deming.leedurbin.co.nz either) get the
        same exclusion for free from the same check.
      -->
      <script>
        if (location.hostname === "deming.leedurbin.co.nz") {
          var sa = document.createElement("script");
          sa.async = true;
          sa.dataset.collectDnt = "false";
          sa.src = "https://scripts.simpleanalyticscdn.com/latest.js";
          document.head.appendChild(sa);
        }
      </script>
      <!--
        Staging banner (#536): visually distinguishes the persistent
        staging deployment from production so a bug found there isn't
        mistaken for a live one. Scoped to the exact staging hostname, not
        "anything that isn't production", so it never affects the per-PR
        previews in accessibility.yml.
      -->
      <script>
        if (location.hostname === "twelve-days-to-deming-staging.vercel.app") {
          document.addEventListener("DOMContentLoaded", function () {
            var banner = document.createElement("div");
            banner.textContent = "STAGING — tracks main, not the live site";
            banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#b91c1c;color:#fff;text-align:center;padding:4px 8px;font:600 13px/1.4 -apple-system,sans-serif;";
            document.body.prepend(banner);
          });
        }
      </script>
      <script type="module" src="/assets/scripts/telemetry.js"></script>
      <script type="module" src="/assets/scripts/storage.js"></script>
      <script type="module" src="/assets/scripts/engagement.js"></script>
      <!--
        feedback-prompt.js and feedback-transport.js deliberately have no tag
        of their own: since #494 they only export, with no side effects on
        load, and chapter-rating.js imports both. The browser resolves those
        imports to the same URLs and evaluates each module once, so a tag
        here would fetch and evaluate code that does nothing on its own.
        Their presence in _book comes from the assets/scripts/** resources
        entry at the top of this file — see the note there, since dropping
        it would make both modules 404 in production.
      -->
      <script type="module" src="/assets/scripts/chapter-rating.js"></script>
      <script type="module" src="/assets/scripts/share-your-experience.js"></script>
      <script>
        (function () {
          try {
            if (localStorage.getItem("td:dyslexic-font") === "1") {
              document.documentElement.classList.add("dyslexic-font");
            }
          } catch (e) {}
        })();
      </script>
      <script src="/assets/scripts/reading-prefs.js"></script>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          var a = document.createElement("a");
          a.href = "#quarto-document-content";
          a.className = "skip-link";
          a.textContent = "Skip to content";
          document.body.insertBefore(a, document.body.firstChild);

          // Quarto 1.4.x emits the header search button with an empty
          // aria-label="" (fixed in later Quarto versions). Patch it here so
          // screen readers get a name until we're ready to bump the CI Quarto
          // pin across deploy.yml + accessibility.yml.
          var s = document.querySelector(".quarto-search-button");
          if (s && !s.getAttribute("aria-label")) {
            s.setAttribute("aria-label", "Search");
          }
        });
      </script>
    number-sections: false
