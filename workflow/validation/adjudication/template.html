<style>
:root {
  --ground: #F4F6F9;
  --surface: #FFFFFF;
  --surface-2: #EDF1F6;
  --ink: #101519;
  --ink-2: #33404E;
  --muted: #5A6675;
  --rule: #D9E0E8;
  --rule-strong: #B9C4D1;
  --accent: #1B3BC4;
  --accent-soft: #E3E8FB;
  --critical: #A8261C;
  --critical-soft: #FBE6E3;
  --ok: #1B6E52;
  --ok-soft: #E0F0E9;
  --warn: #8A5A00;
  --warn-soft: #F8EEDA;
  --shadow: 0 1px 2px rgba(16, 21, 25, .06), 0 8px 24px -16px rgba(16, 21, 25, .28);
  --focus: #1B3BC4;
  --on-accent: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0D1116;
    --surface: #141A21;
    --surface-2: #1A222B;
    --ink: #E4E9EF;
    --ink-2: #C3CDD9;
    --muted: #8E9AA8;
    --rule: #232B35;
    --rule-strong: #35404D;
    --accent: #8AA0FF;
    --accent-soft: #1C2540;
    --critical: #E4796E;
    --critical-soft: #33201E;
    --ok: #5FBF98;
    --ok-soft: #16302A;
    --warn: #D9A441;
    --warn-soft: #322715;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    --focus: #8AA0FF;
    --on-accent: #0D1116;
  }
}
:root[data-theme="dark"] {
  --ground: #0D1116;
  --surface: #141A21;
  --surface-2: #1A222B;
  --ink: #E4E9EF;
  --ink-2: #C3CDD9;
  --muted: #8E9AA8;
  --rule: #232B35;
  --rule-strong: #35404D;
  --accent: #8AA0FF;
  --accent-soft: #1C2540;
  --critical: #E4796E;
  --critical-soft: #33201E;
  --ok: #5FBF98;
  --ok-soft: #16302A;
  --warn: #D9A441;
  --warn-soft: #322715;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  --focus: #8AA0FF;
  --on-accent: #0D1116;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px 96px; }

/* ---------- masthead ---------- */

.masthead { padding: 44px 0 26px; border-bottom: 1px solid var(--rule); }
.eyebrow {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; font-weight: 500; letter-spacing: .13em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 12px;
}
h1 {
  font-family: "Newsreader", Georgia, serif;
  font-weight: 500; font-size: clamp(30px, 4.4vw, 44px); line-height: 1.1;
  margin: 0 0 14px; text-wrap: balance; letter-spacing: -.012em;
}
.standfirst { max-width: 64ch; margin: 0; color: var(--ink-2); font-size: 16px; }
.standfirst strong { font-weight: 600; color: var(--ink); }
.standfirst code, .outro code {
  font-family: "IBM Plex Mono", monospace; font-size: 13px;
  background: var(--surface-2); padding: 1px 5px; border-radius: 4px;
}

.provenance {
  display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 22px;

}
.provenance b { font-weight: 500; color: var(--ink-2); }

/* ---------- command bar ---------- */

.bar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(12px) saturate(1.4);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 30px;
}
.bar-inner {
  max-width: 1000px; margin: 0 auto; padding: 11px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.meter { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.meter-track {

}
.meter-fill { height: 100%; width: 0%; background: var(--accent); transition: width .28s ease; }
.meter-text {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;

}
.filters { display: flex; gap: 4px; flex: 1 1 auto; flex-wrap: wrap; }
.filter {

  border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer;
}
.filter:hover { color: var(--ink); background: var(--surface-2); }
.filter[aria-pressed="true"] {
  background: var(--surface); color: var(--ink); border-color: var(--rule-strong); font-weight: 500;
}
.filter .n { font-family: "IBM Plex Mono", monospace; font-size: 11px; opacity: .7; margin-left: 5px; }

.order {

.order button:hover { color: var(--ink); background: var(--surface-2); }

.btn {
  font: inherit; font-size: 13px; font-weight: 500; padding: 7px 15px; border-radius: 7px;

}

.section { margin: 0 0 46px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }

/* Document order flattens the verdict groups into one list, so two things the

.legend { display: grid; gap: 13px; margin: 0 0 26px; }
.legend-row {

}

.legend-row .n {

}

/* ---------- finding card ---------- */

.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 11px;
  box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
  border-left: 3px solid var(--stripe, var(--rule-strong));
  scroll-margin-top: 76px;
}
.card.k-fix { --stripe: var(--critical); }
.card.k-emph { --stripe: var(--warn); }
.card.k-clear { --stripe: var(--ok); }
.card.k-scope { --stripe: var(--muted); }
.card[data-hidden="1"] { display: none; }
.card.is-cursor { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }

.card-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 13px 17px; border-bottom: 1px solid var(--rule); background: var(--surface);

.loc {

.card-body { padding: 16px 17px 4px; }

.pair { display: grid; gap: 0; margin-bottom: 14px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.side { display: grid; grid-template-columns: 74px 1fr; gap: 0; }

.side-label {

.side-text {

.side-text em { font-style: italic; }
mark { background: none; padding: 1px 0; border-radius: 2px; font-weight: 500; }

.proposal {

.proposal code {

.evidence { font-size: 13.5px; color: var(--ink-2); margin: 0 0 15px; max-width: 74ch; }
.evidence b { font-weight: 600; color: var(--ink); }
.evidence code {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  background: var(--surface-2); padding: 1px 5px; border-radius: 4px;

.flagline { color: var(--muted); font-size: 12.5px; }

/* ---------- decision row ---------- */

.decide {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 17px; border-top: 1px solid var(--rule); background: var(--surface-2);
}
.seg { display: flex; gap: 0; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button {

  color: var(--muted); cursor: pointer; border-right: 1px solid var(--rule);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--surface-2); color: var(--ink); }
.seg button[aria-pressed="true"] { font-weight: 600; color: var(--on-accent); }
.seg button[data-v="accept"][aria-pressed="true"] { background: var(--ok); }
.seg button[data-v="reject"][aria-pressed="true"] { background: var(--muted); }
.seg button[data-v="discuss"][aria-pressed="true"] { background: var(--warn); }

.note-toggle {
  font: inherit; font-size: 12.5px; background: none; border: 0; color: var(--muted);
  cursor: pointer; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px;
}
.note-toggle:hover { color: var(--accent); }
.note-toggle[data-has="1"] { color: var(--accent); font-weight: 500; }
.status { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
.note-wrap { padding: 0 17px 14px; background: var(--surface-2); }
.note-wrap[hidden] { display: none; }
.note-wrap textarea {
  width: 100%; font: inherit; font-size: 13.5px; padding: 9px 11px; border-radius: 7px;
  border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink);
  resize: vertical; min-height: 62px;

/* ---------- footer ---------- */

.outro {

}
.outro h2 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 21px; margin: 0 0 8px; }
.outro p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; max-width: 70ch; }
.outro-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.keys {

@media (max-width: 660px) {

  .loc { margin-left: 0; width: 100%; text-align: left; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

<script>
/* Per-pass content is injected here by scripts/build-adjudication-page.py from
   workflow/validation/adjudications/<pass>.json. Nothing below is pass-specific. */
const PASS = __PASS_JSON__;

const STORE = "td:adjudication:" + PASS.pass + ":v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { state = {}; }

/* Decisions already recorded in the JSON seed the page, so a rebuilt record
   reopens showing what was decided last time rather than a blank slate. */
PASS.sections.forEach(sec => sec.items.forEach(it => {
  if (it.decision && !state[it.id]) {
    state[it.id] = { decision: it.decision, note: it.decision_note || "" };
  }
}));

const allItems = PASS.sections.flatMap(s => s.items.map(i => ({ ...i, section: s.key, labels: s.labels, sec: s })));

/* Document order is Neave's reading order, which is the order someone with the
   manual open in front of them is working through. The verdict groups cut
   across it — Day 5's 21 findings walk its pages 14, 6, 10, 22, 26, 28, 5, …
   grouped, against 9 forward steps in document order. `pdf_page` is recorded
   per finding for this; `page_pos` orders two findings on the same page; a
   finding with no single page sorts last. */
const docOrder = allItems
  .map((it, i) => ({ it, i }))
  .sort((a, b) => {
    const pa = a.it.pdf_page, pb = b.it.pdf_page;
    if (pa !== pb) {
      if (pa == null) return 1;
      if (pb == null) return -1;
      return pa - pb;
    }
    return (a.it.page_pos || 0) - (b.it.page_pos || 0) || a.i - b.i;
  })
  .map(x => x.it);

const VIEW_STORE = "td:adjudication:view:v1";
let cursor = -1;
let filter = "all";
let view = "doc";
try {
  const stored = localStorage.getItem(VIEW_STORE);
  if (stored === "doc" || stored === "section") view = stored;
} catch (e) { /* private window: the default view stands */ }

function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* private window: decisions live for this visit only */ }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderMasthead() {
  const p = PASS.page;
  document.getElementById("masthead").innerHTML = `
    <p class="eyebrow">${esc(p.eyebrow)}</p>
    <h1>${esc(p.title)}</h1>
    <p class="standfirst">${p.standfirst_html}</p>
    <div class="provenance">
      ${p.provenance.map(x => `<span><b>${esc(x.label)}</b> ${esc(x.value)}</span>`).join("")}
    </div>`;
  document.getElementById("outroText").innerHTML =
    `Export writes <code>${esc(PASS.export_filename)}</code> to your downloads folder. Tell me it's there and ` +
    `I'll read it, make exactly the accepted edits, re-run the validator, and open the PR. Nothing is applied ` +
    `until then. Your decisions are also kept in this browser, so you can close the page and come back.`;
}

function render() {
  const host = document.getElementById("sections");
  host.dataset.view = view;
  host.innerHTML = view === "doc" ? docOrderHTML() : groupedHTML();
  cursor = -1;
  syncAll();
}

function groupedHTML() {
  return PASS.sections.map(sec => `
    <section class="section" data-sec="${esc(sec.key)}">
      <div class="section-head">
        <h2>${esc(sec.title)}</h2>
        <span class="section-count">${esc(sec.count)}</span>
      </div>
      <p class="section-note">${sec.note_html}</p>
      ${sec.items.map(it => card(it, sec)).join("")}
    </section>
  `).join("");
}

/* One divider per source page, so the list says where to turn to rather than
   leaving it to be read off each card. Printed page numbers come from the
   record's fixed PDF-to-printed offset, and are dropped for front matter,
   which has no printed number to give. */
function pageLabel(n) {
  if (n == null) return "No single page";
  // Printed pagination starts after the offset, so front matter comes out at or
  // below zero and gets the PDF page alone — there is no printed p0 to cite.
  const printed = PASS.page_offset == null ? 0 : n - PASS.page_offset;
  return `PDF p${n}` + (printed > 0 ? ` · printed p${printed}` : "");
}

function docOrderHTML() {
  let seen = null;
  const list = docOrder.map((it, i) => {
    let divider = "";
    if (i === 0 || it.pdf_page !== seen) {
      seen = it.pdf_page;
      divider = `<div class="page-break" data-pagegroup="${esc(pageGroup(it))}">${esc(pageLabel(seen))}</div>`;
    }
    return divider + card(it, it.sec);
  }).join("");
  return `
    <section class="section" data-sec="doc">
      <div class="section-head">
        <h2>In document order</h2>
        <span class="section-count">${docOrder.length} findings</span>
      </div>
      <div class="legend">
        ${PASS.sections.map(sec => `
          <div class="legend-row ${esc(sec.kind)}">
            <b>${esc(sec.tag || sec.title)}</b><span class="n">${esc(sec.count)}</span>
            <p>${sec.note_html}</p>
          </div>`).join("")}
      </div>
      ${list}
    </section>`;
}

function pageGroup(it) {
  return it.pdf_page == null ? "none" : String(it.pdf_page);
}

function card(it, sec) {
  const loc = it.file
    ? `<span class="loc"><b>${esc(it.file)}:${it.line}</b><br>${esc(it.page)}</span>`
    : `<span class="loc">${esc(it.page)}</span>`;
  return `
  <article class="card ${esc(sec.kind)}" id="c-${esc(it.id)}" data-id="${esc(it.id)}" data-pagegroup="${esc(pageGroup(it))}">
    <div class="card-head">
      <span class="id">${esc(it.id)}</span>
      <span class="chip ${esc(it.chip_class || "")}">${esc(it.chip)}</span>
      <span class="kind-tag">${esc(sec.tag || sec.title)}</span>
      ${loc}
    </div>
    <div class="card-body">
      <div class="pair">
        <div class="side">
          <span class="side-label">Source</span>
          <div class="side-text">${it.source_html}</div>
        </div>
        <div class="side">
          <span class="side-label">Site</span>
          <div class="side-text">${it.site_html}</div>
        </div>
      </div>
      ${it.proposal ? `<div class="proposal"><span class="proposal-label">Replacement text</span><code>${esc(it.proposal)}</code></div>` : ""}
      <p class="evidence">${it.evidence_html}</p>
      <p class="evidence flagline">Flag: ${esc(it.flag)}</p>
    </div>
    <div class="decide">
      <div class="seg" role="group" aria-label="Decision for ${esc(it.id)}">
        <button type="button" data-act="set" data-v="accept" aria-pressed="false">${esc(sec.labels.accept)}</button>
        <button type="button" data-act="set" data-v="reject" aria-pressed="false">${esc(sec.labels.reject)}</button>
        <button type="button" data-act="set" data-v="discuss" aria-pressed="false">${esc(sec.labels.discuss)}</button>
      </div>
      <button type="button" class="note-toggle" data-act="note">Add a note</button>
      <span class="status">undecided</span>
    </div>
    <div class="note-wrap" hidden>
      <textarea placeholder="Anything I should know before making this edit…" aria-label="Note for ${esc(it.id)}"></textarea>
    </div>
  </article>`;
}

function onClick(e) {
  const btn = e.target.closest("button");
  if (!btn) return;
  const card = e.target.closest(".card");
  if (!card) return;
  const id = card.dataset.id;
  if (btn.dataset.act === "set") {
    const v = btn.dataset.v;
    const cur = state[id] || {};
    cur.decision = cur.decision === v ? null : v;
    state[id] = cur;
    save();
    syncCard(card);
    syncBar();
  } else if (btn.dataset.act === "note") {
    const wrap = card.querySelector(".note-wrap");
    wrap.hidden = !wrap.hidden;
    if (!wrap.hidden) wrap.querySelector("textarea").focus();
  }
}

function onInput(e) {
  if (e.target.tagName !== "TEXTAREA") return;
  const card = e.target.closest(".card");
  const cur = state[card.dataset.id] || {};
  cur.note = e.target.value;
  state[card.dataset.id] = cur;
  save();
  syncCard(card);
}

function syncCard(card) {
  const id = card.dataset.id;
  const st = state[id] || {};
  card.querySelectorAll(".seg button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.v === st.decision));
  });
  const item = allItems.find(i => i.id === id);
  card.querySelector(".status").textContent = st.decision ? item.labels[st.decision].toLowerCase() : "undecided";
  const nt = card.querySelector(".note-toggle");
  const has = st.note && st.note.trim().length;
  nt.textContent = has ? "Note added" : "Add a note";
  nt.dataset.has = has ? "1" : "0";
  const ta = card.querySelector("textarea");
  if (st.note && ta.value !== st.note) ta.value = st.note;
  const d = st.decision || null;
  card.dataset.hidden = (filter === "all" || (filter === "open" ? !d : d === filter)) ? "0" : "1";
}

function syncAll() {
  document.querySelectorAll(".card").forEach(syncCard);
  syncBar();
}

function syncBar() {
  const total = allItems.length;
  const counts = { all: total, open: 0, accept: 0, reject: 0, discuss: 0 };
  allItems.forEach(i => {
    const d = (state[i.id] || {}).decision;
    if (!d) counts.open++; else counts[d]++;
  });
  const decided = total - counts.open;
  document.getElementById("meterFill").style.width = (decided / total * 100) + "%";
  document.getElementById("meterText").textContent = `${decided} / ${total} decided`;
  Object.keys(counts).forEach(k => {
    const el = document.querySelector(`[data-c="${k}"]`);
    if (el) el.textContent = counts[k];
  });
  const none = decided === 0;
  ["exportTop", "exportBottom", "copyBtn"].forEach(x => { document.getElementById(x).disabled = none; });
  document.querySelectorAll(".page-break").forEach(pb => {
    const group = pb.dataset.pagegroup;
    const live = document.querySelector(`.card[data-pagegroup="${group}"][data-hidden="0"]`);
    pb.dataset.hidden = live ? "0" : "1";
  });
  document.querySelectorAll(".section").forEach(sec => {
    sec.style.display = sec.querySelectorAll('.card[data-hidden="0"]').length ? "" : "none";
  });
}

document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest(".filter");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".filter").forEach(f => f.setAttribute("aria-pressed", String(f === b)));
  syncAll();
});

function payload() {
  return {
    pass: PASS.pass,
    epic: PASS.epic,
    source_pdf: PASS.source_pdf,
    scorer_version: PASS.scorer_version,
    decided_at: new Date().toISOString().slice(0, 10),
    decisions: allItems.map(i => ({
      id: i.id,
      section: i.section,
      file: i.file ? PASS.content_dir + "/" + i.file : null,
      line: i.line || null,
      decision: (state[i.id] || {}).decision || "undecided",
      note: ((state[i.id] || {}).note || "").trim() || null
    }))
  };
}

function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (err ? " err" : "");
  t.dataset.on = "1";
  setTimeout(() => { t.dataset.on = "0"; }, 4000);
}

async function doExport() {
  const dl = (window.claude && typeof claude.use === "function")
    ? await claude.use("downloads")
    : null;
  if (!dl) { copyJSON(); return; }
  try {
    await dl.save({ filename: PASS.export_filename, data: JSON.stringify(payload(), null, 2) });
    toast("Saved " + PASS.export_filename);
  } catch (e) {
    toast("Save declined — use Copy JSON instead", true);
  }
}

async function copyJSON() {
  try {
    await navigator.clipboard.writeText(JSON.stringify(payload(), null, 2));
    toast("JSON copied — paste it back to Claude");
  } catch (e) {
    toast("Couldn't reach the clipboard. Select the page and copy manually.", true);
  }
}

document.getElementById("exportTop").addEventListener("click", doExport);
document.getElementById("exportBottom").addEventListener("click", doExport);
document.getElementById("copyBtn").addEventListener("click", copyJSON);
document.getElementById("resetBtn").addEventListener("click", () => {
  state = {};
  save();
  document.querySelectorAll("textarea").forEach(t => { t.value = ""; });
  syncAll();
  toast("All decisions cleared");
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
  const vis = [...document.querySelectorAll('.card[data-hidden="0"]')];
  if (!vis.length) return;
  const k = e.key.toLowerCase();
  if (k === "j" || k === "k") {
    e.preventDefault();
    cursor = Math.max(0, Math.min(vis.length - 1, cursor + (k === "j" ? 1 : -1)));
    vis.forEach(c => c.classList.remove("is-cursor"));
    vis[cursor].classList.add("is-cursor");
    vis[cursor].scrollIntoView({ block: "center", behavior: "smooth" });
  } else if (["a", "r", "d"].includes(k) && cursor >= 0 && vis[cursor]) {
    e.preventDefault();
    const map = { a: "accept", r: "reject", d: "discuss" };
    vis[cursor].querySelector(`.seg button[data-v="${map[k]}"]`).click();
  } else if (k === "n" && cursor >= 0 && vis[cursor]) {
    e.preventDefault();
    vis[cursor].querySelector(".note-toggle").click();
  }
});

document.getElementById("order").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || b.dataset.o === view) return;
  view = b.dataset.o;
  try { localStorage.setItem(VIEW_STORE, view); } catch (e) { /* private window */ }
  syncOrderToggle();
  render();
});

function syncOrderToggle() {
  document.querySelectorAll("#order button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.o === view));
  });
}

/* Delegated once, not inside render(): the view toggle replaces the list's
   markup, and re-binding there would double-fire every decision. */
const listHost = document.getElementById("sections");
listHost.addEventListener("click", onClick);
listHost.addEventListener("input", onInput);

renderMasthead();
syncOrderToggle();
render();
</script>
