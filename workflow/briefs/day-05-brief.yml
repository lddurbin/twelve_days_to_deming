# ------ session_minutes Computation (2026-08-06) ------
# Method (Day 2/3/4 precedent): each chapter's opening clock = the earliest
# checkpoint on or after the chapter's true first page (confirmed via the
# qmd {#sec-pageN} anchors: introduction opens page 1, points-7-to-14 opens
# page 2, the-deadly-diseases opens page 18). session_minutes = next
# chapter's opening clock minus this chapter's opening clock, in minutes.
# Left unset where the gap spans the lunch break. For the day's last
# chapter, the confirmed day-end clock (5:15pm, p27 bottom) substitutes for
# a next chapter's opening clock.
#
#   chapter                  opens    next chapter's opening   session_minutes
#   introduction (p1)        9:00am   9:45am                   45
#   points-7-to-14 (p2,      9:45am   2:45pm                   unset — spans lunch
#   substitute — no                                            (12:15-1:15pm)
#   checkpoint on p2 itself,
#   nearest is p3 bottom)
#   the-deadly-diseases      2:45pm   5:15pm (day end)          150
#   (p18, exact)
#
# One chapter's opening checkpoint is a substitute rather than an exact
# match to its true first page: points-7-to-14 (p3 bottom stands in for
# p2 — one page late). This slightly overstates introduction's computed
# length by folding page 2's reading time into introduction's window
# instead of crediting it to points-7-to-14 — the same known limitation
# noted in Day 2's and Day 4's briefs. introduction and the-deadly-diseases
# both open on exact checkpoints (p1 top, p18 top respectively).

