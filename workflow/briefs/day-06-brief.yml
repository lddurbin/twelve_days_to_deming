# ------ session_minutes Computation (2026-08-08) ------
# Method: each chapter's "opening clock" = the earliest doc-page checkpoint
# on or after the chapter's own first doc page (per PATTERNS.md's
# session_minutes rules). session_minutes = next chapter's opening clock
# minus this chapter's opening clock, in minutes.
#
#   chapter                    opening (doc page)   next chapter's opening    session_minutes
#   introduction (doc1)       9:00am                9:15am (gallery-furn.)   15
#   gallery-furniture (doc3)  9:15am                10:45am (activity-6b)    90
#   activity-6b (doc18)       10:45am               3:30pm (more-true-st.)   unset — spans lunch
#   more-true-stories (doc26) 3:30pm                (no further clocks)     unset — last chapter, no day-end anchor
#
# activity-6b is left unset despite having the richest internal data of any
# Day 6 chapter (5 checkpoints across its own doc pp 18-20, pacing each step
# of the Activity 6-b instructions individually). Its own opening-to-next
# gap crosses the lunch break: the chapter's own checkpoints show the 4th
# clock on doc p18 explicitly closing the morning at 12:45pm, and doc p20's
# clock explicitly reopening the afternoon at 1:45pm — so the raw gap
# (10:45am to 3:30pm) would silently fold an hour of lunch into a
# session-time figure. There's no clean substitute endpoint either: the
# established method measures next-chapter's-opening minus this-chapter's-
# opening, not a chapter's own last internal checkpoint (which would be
# doc p21, 2:45pm) — see PATTERNS.md's set/unset rules and the Day 2
# `your-turn` precedent for the same lunch-spanning situation.
#
# more-true-stories is left unset because it's Day 6's last chapter and no
# clock exists past its own opening checkpoint to close it out. That opening
# checkpoint (doc p26, 3:30pm) isn't near the chapter's own first page
# (doc22) — it's the earliest one actually falling in-range, so it stands in
# per the established method (precedent: Day 2's `a-brief-overview` and
# `the-truth-the-whole-truth`, which substituted a later in-range checkpoint
# for a chapter's true first page when nothing landed exactly on it). This
# day's context_notes below records a "4:00 Approx finish" from the page 3
# schedule — deliberately not used as a day-end substitute here, since it's
# pre-existing schedule-summary text (not a per-page clock icon read, and
# explicitly hedged "Approx"), not the kind of reliable printed closing time
# or explicit end-of-day clock read PATTERNS.md's day-end exception asks for.

