# Raw pacing-clock reads, dictated directly from the source pages rather
# than extracted from the outline page — the outline page's clock column
# turned out to be a shared decorative template, not real per-day data
# (see issue #471 and project memory project_clock_extraction_paused.md).
# Page numbers are printed page numbers, matching the chapter `pages:`
# ranges above. Two clock columns run throughout Day 2: left column =
# Stats-level 0, right column = Stats-level 1-3 (Stats-level 0 skips the
# "technical aids" content, hence the occasional duplicate time between
# columns). Validated against the day's printed time range
# (9.15am-12.45pm; 1.45pm-4.45pm): p1 top = 9:15am (day start), p27
# bottom = 12:45pm (morning end), p28 top = 1:45pm (afternoon start),
# p43 middle = 4:45pm (day end) — all match exactly.
