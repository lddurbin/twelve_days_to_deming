# ------ session_minutes Computation (2026-08-01) ------
# Site chapters render Neave's full text for every reader, including the
# Technical Aids that Stats-level 0 is invited (in-prose) to skip — see
# 05-the-truth-the-whole-truth-and-nothing-but.qmd:70. So the Stats-level
# 1-3 track (the "read everything" path) is the correct source for
# session_minutes, not Stats-level 0.
#
# Method: each chapter's "opening clock" = the earliest Stats-level 1-3
# checkpoint on or after the chapter's first page (per PATTERNS.md's
# session_minutes rules). session_minutes = next chapter's opening clock
# minus this chapter's opening clock, in minutes. Left unset where the
# gap spans the lunch break. For the day's last chapter (postscript),
# the day-end clock (5:00pm, p43 middle) substitutes for a next
# chapter's opening clock — see the day-end exception added to
# PATTERNS.md's session_minutes rules on 2026-08-01.
#
#   chapter                              opening   next chapter's   session_minutes
#                                         clock     opening clock
#   run-charts (p1)                      9:00am    9:35am           35
#   intro-to-the-red-beads-experiment(p6)9:35am    10:20am          45
#   a-brief-overview (p9→p11 checkpoint) 10:20am   10:30am          10
#   our-first-control-chart (p13)        10:30am   10:55am          25
#   the-truth-the-whole-truth (p15→p16)  10:55am   11:40am          45
#   your-turn (p22)                      11:40am   1:45pm           unset — spans lunch (12:45-1:45pm)
#   some-recollections (p28)             1:45pm    3:30pm           105
#   major-activity (p38)                 3:30pm    4:30pm           60
#   postscript (p40)                     4:30pm    5:00pm (day end) 30
#
# Two chapters' opening pages (a-brief-overview p9, the-truth... p15) have
# no checkpoint exactly on their first page — the nearest available
# checkpoint 1-2 pages later was used instead (p11 and p16 respectively).
# This slightly understates those two chapters' true session length and
# is a known limitation of the checkpoint density, not an error.
#
# ------ Stats-level 0 track, same method (2026-08-01) ------
# Running the identical computation over the left-hand (Stats-level 0)
# column shows the two tracks agree on 6 of the 8 settable chapters.
# That is expected, not a coincidence: Stats-level 1-3 runs a constant
# 15 min ahead through the morning, and session_minutes is a *difference*
# between consecutive clocks, so a constant offset cancels. The tracks
# only diverge where Stats-level 0's path through the material genuinely
# differs.
#
#   chapter                     opens (S0 / S1-3)      S0   S1-3
#   run-charts                  9:15am  / 9:00am       35     35
#   intro-to-the-red-beads      9:50am  / 9:35am       45     45
#   a-brief-overview            10:35am / 10:20am      10     10
#   our-first-control-chart     10:45am / 10:30am      25     25
#   the-truth-the-whole-truth   11:10am / 10:55am      30     45   ← DIFFERS
#   your-turn                   11:40am / 11:40am   unset  unset   (spans lunch)
#   some-recollections          1:45pm  / 1:45pm       90    105   ← DIFFERS
#   major-activity              3:15pm  / 3:30pm       60     60
#   postscript                  4:15pm  / 4:30pm       30     30
#
# The whole 30-min day-length difference (S0 9:15am-4:45pm = 390 min;
# S1-3 9:00am-5:00pm = 420 min) sits in those two chapters, 15 min each.
# They diverge for different reasons, which is why the rendered label is
# Neave's own "Stats-level 0" rather than a per-chapter explanation:
#   - the-truth-the-whole-truth: Stats-level 0 genuinely skips content —
#     the three Technical Aids ("please now move straight on to page 22",
#     05-the-truth-the-whole-truth-and-nothing-but.qmd:71).
#   - some-recollections: nothing is skipped. Stats-level 0 looks the
#     control limits up on Appendix page 8 instead of computing them
#     (07-some-recollections.qmd:138-140 and :327).
# Only those two chapters carry session_minutes_stats0 in front-matter.

