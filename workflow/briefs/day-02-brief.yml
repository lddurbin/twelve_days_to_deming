# Cross-track validation: Stats-level 1-3 starts 15 min earlier
# (9:00am vs 9:15am) and runs a stable +15 min ahead of Stats-level 0
# through p16 — consistent with reading extra content Stats-level 0
# skips. At p20 (technical aids), Stats-level 0's lead is fully
# absorbed: both tracks land on the exact same absolute times from
# p22 through p27 (lunch), matching at 12:45pm exactly. Both restart
# together at 1:45pm, then Stats-level 1-3 gradually re-opens a 15 min
# gap through the afternoon, ending at 5:00pm vs 4:45pm — mirroring
