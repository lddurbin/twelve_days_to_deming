# ------ session_minutes Computation (2026-08-01) ------
# Method: each chapter's session_minutes = (next chapter's opening clock) -
# (this chapter's opening clock), per PATTERNS.md, sourced from the
# Stats-level 1-3 ("read everything") track for the morning and the single
# shared track for the afternoon. Where a chapter's own true opening page has
# no checkpoint, the nearest available later checkpoint stands in (Day 2
# precedent) - noted per chapter.
#
# Lee confirmed two source-side gaps, both genuine absences rather than
# un-dictated data: page 5 (at-the-ford-motor-company's own opening page)
# carries no clock icons at all, and pages 26-28 (control-chart-and-brain's
# own opening through most of its body) carry none either - the only clocks
# in that stretch are p25 bottom (end of a-favourite-example) and p29 bottom
# (end of control-chart-and-brain). An earlier pass here briefly recorded a
# checkpoint at "p26 bottom" that turned out to be a mis-transcription of the
# already-recorded p25-bottom reading - corrected back out; there is no p26
# checkpoint. Two chapters (at-the-ford-motor-company, control-chart-and-
# brain) therefore have no usable checkpoint anywhere near their own opening
# page - the nearest available checkpoint is actually that SAME chapter's
# own closing page, which would make its own "opening" and the following
# chapter's computation collide and collapse toward zero. Left unset rather
# than publish an artifact of checkpoint placement.
#
#   chapter                          opens    next opens   session_minutes
#   variation-the-enemy-of-quality   9:00am   9:55am       55   (next-chapter substitute is at-the-ford-motor-company's own closing page, p6 - likely folds in most of that chapter's true length; see at-the-ford-motor-company below)
